# Template _quarto.yml for a gh-quarto-publish consumer repo.
# Replace <project> and the render/sidebar lists with your repo's docs.
project:
  type: website
  # Extra files no page references (e.g. a social-preview card image) must be
  # listed under resources: — Quarto only auto-copies page-referenced assets.
  # They land in _site at their PROJECT-ROOT-RELATIVE path, so
  # docs/images/og-card.png publishes to <site-url>/<branch>/docs/images/og-card.png.
  # resources:
  #   - docs/images/og-card.png
  render:
    - index.md
    - README.md         # README files must be listed explicitly; globs skip them
    - docs/*.md
    # Exclude repo-only documents (design records, maintainer notes) from the
    # published site with a "!" entry — they stay in the repo:
    # - "!docs/some-design-record.md"

# gfm_auto_identifiers makes heading anchors match GitHub's slugs, which the
# docs' cross-links use. Keep pandoc's full markdown reader otherwise —
# `from: gfm` breaks Quarto's navigation divs.
from: markdown+gfm_auto_identifiers

website:
  title: "<project>"
  # Social previews (Reddit / Slack / iMessage read Open Graph tags). The
  # og:image MUST be an absolute URL — crawlers can't resolve relative paths —
  # and an absolute URL skips Quarto's auto-copy, so the file also needs the
  # resources: entry above. See integration.md § Social previews.
  # site-url: https://docs.example.com/<project>
  # open-graph:
  #   image: https://docs.example.com/<project>/main/docs/images/og-card.png
  #   locale: en_US
  # twitter-card: true
  search: true
  sidebar:
    style: docked
    tools:
      - icon: github
        href: https://github.com/<owner>/<project>
        text: GitHub repository
    contents:
      - text: "Home"
        href: index.md
      - text: "Overview (README)"
        href: README.md
      # Group further docs into sections:
      # - section: "Guides"
      #   contents:
      #     - docs/guide-one.md

format:
  html:
    theme: pulse
    toc: true
    embed-resources: true
